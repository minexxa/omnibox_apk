name: Build OmniBox TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 内核 so 已随仓库提交；APK 只打包 armeabi-v7a，此处仅校验所需的 so
      - name: Verify libomnibox_core.so
        run: |
          set -e
          for ABI in armeabi-v7a; do
            TARGET="app/src/main/jniLibs/$ABI/libomnibox_core.so"
            if [ ! -s "$TARGET" ]; then
              echo "::error::缺少 $TARGET"
              exit 1
            fi
            file "$TARGET"
          done

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnibox-tv-armeabi-v7a
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
