name: Build Android Core

on:
  workflow_dispatch:
  
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    name: android-arm64-armv7
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: rust-core

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Workaround NDK r23+ missing libgcc
        shell: bash
        run: |
          NDK_HOME="${{ steps.ndk.outputs.ndk-path }}"
          find "${NDK_HOME}" -name "libunwind.a" -print | while read -r f; do
            dir=$(dirname "$f")
            echo "INPUT(-lunwind)" > "${dir}/libgcc.a"
          done

      # 一次构建两个 ABI：arm64-v8a（aarch64）+ armeabi-v7a（armv7a）
      - name: Build release (arm64-v8a + armeabi-v7a)
        run: |
          cargo ndk --target arm64-v8a --target armeabi-v7a --platform 26 \
            -o "$GITHUB_WORKSPACE/dist-jni" build --release --locked
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # 安卓端优先体积：opt-level=s（Windows 构建不受影响）
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s

      # Release 资产不能同名：按 ABI 命名
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp dist-jni/arm64-v8a/libomnibox_core.so   dist/libomnibox_core-arm64-v8a.so
          cp dist-jni/armeabi-v7a/libomnibox_core.so dist/libomnibox_core-armeabi-v7a.so
          file dist/*.so
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libomnibox_core-android
          path: dist/*.so
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-latest
          prerelease: true
          overwrite_files: true
          files: dist/*.so
